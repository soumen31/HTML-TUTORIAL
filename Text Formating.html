<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1><b>this is a heading</b></h1>
    <h1><strong>this is a heading</strong></h1>
    <h1><i>this is a heading</i></h1>
    <h1><em>this is a heading</em></h1>
    <h1>this is a heading<mark>heading</mark></h1>
    <h1><small>this is a heading</small></h1>
    <h1>this is a heading<del>heading</del> head</h1>
    <h1>this is a heading<ins>heading</ins> head</h1>
    <h1>this is a heading<sub>heading</sub> head</h1>
    <h1>this is a heading<sup>heading</sup> head</h1>
    
</body>
</html>
